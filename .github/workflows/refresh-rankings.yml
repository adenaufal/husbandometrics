name: Refresh rankings

# The board is a weekly measurement, so the data is rebuilt on a schedule and
# committed. Netlify redeploys on the push, and the site stays static.
on:
  schedule:
    # Mondays 04:00 UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full read paces ~80 AO3 requests and takes about four minutes; this is
    # headroom for a slow upstream, not an expected duration.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read sources and write the board
        run: npm run snapshot

      - name: Commit if the numbers moved
        run: |
          if [ -z "$(git status --porcelain public/rankings.json data/snapshots.json)" ]; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rankings.json data/snapshots.json
          git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
          git push
