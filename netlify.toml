[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The board ships as a committed file, so the deploy never reads an upstream
# source. Rebuilding the data belongs to the scheduled job, not to a deploy.
[[headers]]
  for = "/rankings.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
